name: Deploy to Aliyun Server

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build backend
      run: |
        cd backend
        npm ci
        npm run build

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /var/www/notepad
          git pull origin development

          cd backend
          npm ci
          npm run build

          cd ../frontend
          npm ci
          npm run build

          pm2 restart notepad-api || pm2 start backend/dist/index.js --name notepad-api