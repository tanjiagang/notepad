name: Deploy to Aliyun Server

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build backend
      run: |
        cd backend
        npm ci
        npm run build

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 39.104.28.195
        username: root
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        debug: true
        script: |
          cd /var/www/wwwroot/notepad
          git pull origin development

          cd backend
          npm ci
          npm run build

          cd ../frontend
          npm ci
          npm run build

          pm2 restart notepad-backend || pm2 start backend/dist/index.js --name notepad-backend
          pm2 save
          nginx -s reload
